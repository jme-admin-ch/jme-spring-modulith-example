server:
  port: 8091

mockserver:
  base-url: "http://localhost:${server.port}/jme-spring-modulith-auth-scs"

# See the jeap-oauth-mock-server project for a detailed explanation of these configuration parameters.
oauth-mock-data:

  clients:

    # Browser client used by the Error Handling UI for the authorization-code flow.
    - client-id: "error-handling-ui"
      context: "USER"
      registered-redirect-uri:
        - "http://localhost:8092/error-handling/redirect"
        - "http://localhost:8092/error-handling/assets/auth/silent-renew.html"
      registered-post-logout-redirect-uri:
        - "http://localhost:8092/error-handling/"
      userroles:
        - "jme_@error_#view"
        - "jme_@error_#retry"
        - "jme_@error_#delete"
        - "jme_@errorgroup_#view"
        - "jme_@errorgroup_#edit"
      audience: [ "jme-spring-modulith-error-scs" ]

    # Client used by the README examples and by the integration tests to call the REST API of
    # jme-spring-modulith-service. It carries one semantic role per application module of the modulith.
    - client-id: "jme-spring-modulith-client"
      client-secret: "{noop}secret"
      # SYS context = service-to-service call via the OAuth2 client credentials flow
      context: "SYS"
      userroles:
        - "jme_@order_#read"
        - "jme_@order_#write"
        - "jme_@inventory_#read"
        - "jme_@notification_#read"
        - "jme_@shipping_#read"
      # Audience the token is issued for. jme-spring-modulith-service validates that its own
      # application name is contained in the audience of every incoming token.
      audience: [ "jme-spring-modulith-service" ]

    # Same as above but without any of the roles above, to demonstrate that an authenticated caller
    # without the required semantic role is rejected with HTTP 403.
    - client-id: "jme-spring-modulith-client-without-roles"
      client-secret: "{noop}secret"
      context: "SYS"
      userroles:
        - "jme_@unrelated_#read"
      audience: [ "jme-spring-modulith-service" ]

    # Client used by the integration tests and by the README examples to query the error handling
    # service. Its audience and roles are those of the error handling service, not of the modulith.
    - client-id: "jme-spring-modulith-error-client"
      client-secret: "{noop}secret"
      context: "SYS"
      userroles:
        - "jme_@error_#view"
        - "jme_@error_#retry"
        - "jme_@error_#delete"
        - "jme_@errorgroup_#view"
        - "jme_@errorgroup_#edit"
      audience: [ "jme-spring-modulith-error-scs" ]

    # Client used by jme-spring-modulith-error-scs to call other services in the system context.
    - client-id: "jme-spring-modulith-error-service"
      client-secret: "{noop}secret"
      context: "SYS"
      userroles:
        - "jme_@error_#view"
        - "jme_@error_#retry"
        - "jme_@error_#delete"
        - "jme_@errorgroup_#view"
        - "jme_@errorgroup_#edit"
      audience: [ "jme-spring-modulith-error-scs" ]

  users:
    # User offered in the login form of the mock server, holding every role used in this example.
    - id: "user"
      given-name: "Henriette"
      family-name: "Muster"
      locale: "DE"
      preferred-username: "12345"
      userroles:
        - "jme_@order_#read"
        - "jme_@order_#write"
        - "jme_@inventory_#read"
        - "jme_@notification_#read"
        - "jme_@shipping_#read"
        - "jme_@error_#view"
        - "jme_@error_#retry"
        - "jme_@error_#delete"
        - "jme_@errorgroup_#view"
        - "jme_@errorgroup_#edit"

jeap:
  monitor:
    prometheus:
      password: "{noop}secret"
